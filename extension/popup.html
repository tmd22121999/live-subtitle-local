<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, -apple-system, sans-serif; width: 240px; padding: 12px; box-sizing: border-box; }
    strong { display: block; font-size: 15px; margin-bottom: 4px; }
    p { margin: 4px 0 8px; color: #444; }
    .field { margin: 8px 0; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    select { width: 100%; padding: 7px 8px; font: 13px system-ui, sans-serif; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 9px; width: 100%; margin: 5px 0; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; background: #f8f8f8; font-weight: 500; }
    button#start { background: #1a73e8; color: white; border-color: #1557b0; }
    button#start:hover { background: #1557b0; }
    button#stop:hover { background: #eee; }
    #status { font-size: 12px; white-space: pre-wrap; margin-top: 8px; min-height: 16px; }
    #detected-lang { font-size: 12px; color: #0b8043; font-weight: 600; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <strong>Local Vietnamese Subtitles</strong>
  <p>Open a video tab, then start.</p>
  <div class="field">
    <label for="source-lang">Source Language</label>
    <select id="source-lang">
      <option value="auto">Auto Detect</option>
      <option value="ja">Japanese</option>
      <option value="en">English</option>
      <option value="ko">Korean</option>
      <option value="zh">Chinese</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>
      <option value="vi">Vietnamese</option>
    </select>
    <div id="detected-lang"></div>
  </div>
  <button id="start">Start translation</button>
  <button id="stop">Stop</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
